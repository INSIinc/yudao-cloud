--- #################### 注册中心 + 配置中心相关配置 ####################
# 本地开发环境：单体模式，禁用微服务相关配置

spring:
  cloud:
    nacos:
      discovery: # 【服务发现】配置项
        enabled: false # 本地开发使用单体模式，禁用服务发现
      config: # 【配置中心】配置项
        enabled: false # 禁用配置中心

  # Redis 配置。Redisson 默认的配置足够使用，一般不需要进行调优
  data:
    redis:
      host: 127.0.0.1 # 地址
      port: 6380 # 端口（对应 docker-compose.yml 中映射的端口）
      database: 0 # 数据库索引
      password: 123456 # 密码，建议生产环境开启

# 日志文件配置
logging:
  level:
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR # TODO 芋艿：先禁用，Spring Boot 3.X 存在部分错误的 WARN 提示
