version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: yudao-postgres
    restart: always
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 注释掉自动初始化脚本，改用 Flyway 管理数据库迁移
      # - ./sql/postgresql:/docker-entrypoint-initdb.d
    networks:
      - yudao-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yudao-redis
    restart: always
    command: redis-server --requirepass 123456 --appendonly yes
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - yudao-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  yudao-network:
    driver: bridge

