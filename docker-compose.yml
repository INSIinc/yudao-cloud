# 本地开发环境 Docker Compose 配置
# 使用 Docker Compose 拆分配置文件，方便管理和维护

# 包含基础设施服务
include:
  # PostgreSQL 数据库（本地开发默认端口 5433）
  - path: docker/postgres.yml
    env_file: .env

  # Redis 缓存（本地开发默认端口 6380）
  - path: docker/redis.yml
    env_file: .env

  # PgAdmin 数据库管理工具（本地开发默认端口 5051）
  - path: docker/pgadmin.yml
    env_file: .env

  # MinIO 对象存储（本地开发默认端口 9000/9001）
  - path: docker/minio.yml
    env_file: .env

  # MySQL 数据库（可选，仅用于 Nacos，取消注释以启用）
  # - path: docker/mysql.yml
  #   env_file: .env

  # Nacos 注册中心和配置中心（可选，微服务模式需要，取消注释以启用）
  # - path: docker/nacos.yml
  #   env_file: .env

# 共享网络
networks:
  yudao-network:
    driver: bridge

