--- #################### 注册中心 + 配置中心相关配置 ####################
# 生产环境：微服务模式，启用 Nacos 和 OpenFeign

spring:
  cloud:
    nacos:
      server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848} # Nacos 服务器地址
      username: ${NACOS_USERNAME:} # Nacos 账号
      password: ${NACOS_PASSWORD:} # Nacos 密码
      discovery: # 【服务发现】配置项
        enabled: true # 启用服务发现
        namespace: ${NACOS_NAMESPACE:} # 命名空间，建议生产环境使用独立命名空间
        group: DEFAULT_GROUP # 使用的 Nacos 配置分组，默认为 DEFAULT_GROUP
        metadata:
          version: 1.0.0 # 服务实例的版本号，可用于灰度发布
      config: # 【配置中心】配置项
        enabled: false # 禁用配置中心（如需要可启用）
        namespace: ${NACOS_NAMESPACE:} # 命名空间
        group: DEFAULT_GROUP # 使用的 Nacos 配置分组，默认为 DEFAULT_GROUP
    openfeign: # 【OpenFeign】配置项
      enabled: true # 启用 OpenFeign，微服务模式必须开启

--- #################### 数据库相关配置 ####################
spring:
  datasource:
    druid: # Druid 【监控】相关的全局配置
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: false # 生产环境建议关闭 Druid 监控页面
      filter:
        stat:
          enabled: true
          log-slow-sql: true # 慢 SQL 记录
          slow-sql-millis: 100
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic: # 多数据源配置
      druid: # Druid 【连接池】相关的全局配置
        initial-size: 5 # 初始连接数
        min-idle: 10 # 最小连接池数量
        max-active: 50 # 最大连接池数量
        max-wait: 60000 # 配置获取连接等待超时的时间，单位：毫秒
        time-between-eviction-runs-millis: 60000 # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位：毫秒
        min-evictable-idle-time-millis: 600000 # 配置一个连接在池中最小生存的时间，单位：毫秒
        max-evictable-idle-time-millis: 1800000 # 配置一个连接在池中最大生存的时间，单位：毫秒
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
      primary: master
      datasource:
        master:
          url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:app}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:}
        slave: # 从库配置
          lazy: true
          url: jdbc:postgresql://${DB_SLAVE_HOST:127.0.0.1}:${DB_SLAVE_PORT:5432}/${DB_SLAVE_NAME:app}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: ${DB_SLAVE_USERNAME:root}
          password: ${DB_SLAVE_PASSWORD:}

  # Redis 配置。Redisson 默认的配置足够使用，一般不需要进行调优
  data:
    redis:
      host: ${REDIS_HOST:redis} # 地址，支持环境变量
      port: ${REDIS_PORT:6379} # 端口，支持环境变量
      database: ${REDIS_DATABASE:0} # 数据库索引
      password: ${REDIS_PASSWORD:} # 密码，生产环境必须开启

  # Flyway 配置
  flyway:
    enabled: ${FLYWAY_ENABLED:true} # 启用 Flyway，支持环境变量控制
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration/mysql} # 迁移脚本路径，默认 MySQL，支持环境变量
    baseline-on-migrate: true # 如果数据库不是空的，需要先建立基线
    baseline-version: 0 # 基线版本

--- #################### MQ 消息队列相关配置 ####################

# RocketMQ 配置项
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}

spring:
  # RabbitMQ 配置项
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  # Kafka 配置项
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:127.0.0.1:9092}

--- #################### 定时任务相关配置 ####################

xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:false} # 是否开启调度中心
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:9090/xxl-job-admin}

--- #################### 服务保障相关配置 ####################

# Lock4j 配置项
lock4j:
  acquire-timeout: 3000 # 获取分布式锁超时时间
  expire: 30000 # 分布式锁的超时时间

--- #################### 监控相关配置 ####################

# Actuator 监控端点的配置项
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health,info,prometheus' # 生产环境建议只开放必要的端点

# Spring Boot Admin 配置项
spring:
  boot:
    admin:
      client:
        instance:
          service-host-type: IP # 注册实例时，优先使用 IP

# 日志文件配置
logging:
  level:
    # 生产环境日志级别
    cn.iocoder.yudao.module.system.dal.mysql: info
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR

--- #################### 微信公众号、小程序相关配置 ####################
wx:
  mp: # 公众号配置
    app-id: ${WX_MP_APP_ID:}
    secret: ${WX_MP_SECRET:}
    config-storage:
      type: RedisTemplate
      key-prefix: wx
      http-client-type: HttpClient
  miniapp: # 小程序配置
    appid: ${WX_MINIAPP_APP_ID:}
    secret: ${WX_MINIAPP_SECRET:}
    config-storage:
      type: RedisTemplate
      key-prefix: wa
      http-client-type: HttpClient

--- #################### 芋道相关配置 ####################

yudao:
  env:
    tag: ${HOSTNAME}
  captcha:
    enable: false # 生产环境不启用验证码
  security:
    mock-enable: true # 生产环境也用 Mock
  access-log:
    enable: true
  wxa-code:
    env-version: release # 生产环境使用正式版小程序
  wxa-subscribe-message:
    miniprogram-state: formal # 生产环境跳转正式版小程序

justauth:
  enabled: true
  type:
    DINGTALK:
      client-id: ${JUSTAUTH_DINGTALK_CLIENT_ID:}
      client-secret: ${JUSTAUTH_DINGTALK_CLIENT_SECRET:}
      ignore-check-redirect-uri: true
    WECHAT_ENTERPRISE:
      client-id: ${JUSTAUTH_WECHAT_ENTERPRISE_CLIENT_ID:}
      client-secret: ${JUSTAUTH_WECHAT_ENTERPRISE_CLIENT_SECRET:}
      agent-id: ${JUSTAUTH_WECHAT_ENTERPRISE_AGENT_ID:}
      ignore-check-redirect-uri: true
    WECHAT_MINI_PROGRAM:
      client-id: ${wx.miniapp.appid}
      client-secret: ${wx.miniapp.secret}
      ignore-check-redirect-uri: true
      ignore-check-state: true
    WECHAT_MP:
      client-id: ${wx.mp.app-id}
      client-secret: ${wx.mp.secret}
      ignore-check-redirect-uri: true
  cache:
    type: REDIS
    prefix: 'social_auth_state:'
    timeout: 24h
