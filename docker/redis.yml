services:
  redis:
    image: redis:7-alpine # arm: redis:7.2.4
    container_name: yudao-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456} --appendonly yes
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${REDIS_DATA_PATH:-./volumes/redis-data}:/data
    networks:
      - yudao-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  yudao-network:
    driver: bridge
