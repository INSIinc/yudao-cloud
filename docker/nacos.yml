services:
  nacos:
    image: nacos/nacos-server:v2.5.1 # arm: nacos/nacos-server-arm:v2.5.1
    container_name: yudao-nacos
    restart: always
    environment:
      MODE: standalone
      # MySQL 数据源配置
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      NACOS_AUTH_ENABLE: false
      TZ: Asia/Shanghai
      # JVM_XMS: 512m
      # JVM_XMX: 512m
      # JVM_XMN: 256m
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
      - "${NACOS_GRPC_SERVER_PORT:-9849}:9849"
    volumes:
      - ${NACOS_LOGS_PATH:-./volumes/nacos-logs}:/home/nacos/logs
      - ${NACOS_DATA_PATH:-./volumes/nacos-data}:/home/nacos/data
    networks:
      - yudao-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  yudao-network:
    driver: bridge
