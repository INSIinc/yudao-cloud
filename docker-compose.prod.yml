# 生产环境 Docker Compose 配置
# 使用 Docker Compose 拆分配置文件，方便管理和维护
include:
  # 基础设施服务 - PostgreSQL 数据库（生产环境默认端口 5432）
  - path: docker/postgres.yml
    env_file: .env

  # 基础设施服务 - Redis 缓存（生产环境默认端口 6379）
  - path: docker/redis.yml
    env_file: .env

  # 基础设施服务 - MySQL 数据库（Nacos 使用，默认端口 3306）
  - path: docker/mysql.yml
    env_file: .env

  # 基础设施服务 - Nacos 注册中心和配置中心（默认端口 8848）
  - path: docker/nacos.yml
    env_file: .env

  # 基础设施服务 - PgAdmin 数据库管理工具（可选，默认端口 5051）
  - path: docker/pgadmin.yml
    env_file: .env

  # 应用服务 - Yudao System 系统功能模块（默认端口 48081）
  - path: docker/yudao/system.yml
    env_file: .env

  # 应用服务 - Yudao Infra 基础设施模块（默认端口 48082）
  - path: docker/yudao/infra.yml
    env_file: .env

  # 应用服务 - Yudao BPM 工作流模块（默认端口 48083）
  - path: docker/yudao/bpm.yml
    env_file: .env

  # 应用服务 - Yudao Gateway 网关服务（默认端口 48080）
  - path: docker/yudao/gateway.yml
    env_file: .env

  - path: docker/app.yml
    env_file: .env

# 共享网络
networks:
  yudao-network:
    driver: bridge
