    enable: true # 生产环境开启图片验证码
  security:
    mock-enable: false # 生产环境关闭 Mock 功能
  pay:
    order-notify-url: ${PAY_ORDER_NOTIFY_URL:http://your-domain.com/admin-api/pay/notify/order} # 支付渠道的【支付】回调地址
    refund-notify-url: ${PAY_REFUND_NOTIFY_URL:http://your-domain.com/admin-api/pay/notify/refund} # 支付渠道的【退款】回调地址
    transfer-notify-url: ${PAY_TRANSFER_NOTIFY_URL:http://your-domain.com/admin-api/pay/notify/transfer} # 支付渠道的【转账】回调地址
  access-log: # 访问日志的配置项
