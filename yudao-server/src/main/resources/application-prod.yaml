server:
  port: 48080

--- #################### 数据库相关配置 ####################
spring:
  autoconfigure:
    # noinspection SpringBootApplicationYaml
    exclude:
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration # 禁用 AI 模块的 Qdrant，手动创建
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration # 禁用 AI 模块的 Milvus，手动创建
  # 数据源配置项
  datasource:
    druid: # Druid 【监控】相关的全局配置
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: false # 生产环境建议关闭 Druid 监控页面
        allow: # 设置白名单，不填则允许所有访问
        url-pattern: /druid/*
        login-username: admin # 控制台管理用户名和密码
        login-password: ${DRUID_PASSWORD:admin123}
      filter:
        stat:
          enabled: true
          log-slow-sql: true # 慢 SQL 记录
          slow-sql-millis: 200 # 生产环境慢查询阈值设置为 200ms
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic: # 多数据源配置
      druid: # Druid 【连接池】相关的全局配置
        initial-size: 5 # 初始连接数
        min-idle: 5 # 最小连接池数量
        max-active: 50 # 最大连接池数量（生产环境适当调大）
        max-wait: 60000 # 配置获取连接等待超时的时间，单位：毫秒（1 分钟）
        time-between-eviction-runs-millis: 60000 # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位：毫秒（1 分钟）
        min-evictable-idle-time-millis: 600000 # 配置一个连接在池中最小生存的时间，单位：毫秒（10 分钟）
        max-evictable-idle-time-millis: 1800000 # 配置一个连接在池中最大生存的时间，单位：毫秒（30 分钟）
        validation-query: SELECT 1 # PostgreSQL 兼容的连接验证语句
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true # 是否开启 PreparedStatement 缓存
        max-pool-prepared-statement-per-connection-size: 20 # 每个连接缓存的 PreparedStatement 数量
      primary: master
      datasource:
        master:
          # 使用环境变量配置数据库连接，支持 Docker 部署
          url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:app}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:123456}
        slave: # 模拟从库，可根据自己需要修改
          lazy: true # 开启懒加载，保证启动速度
          url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:app}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&nullCatalogMeansCurrent=true
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:123456}

  # Redis 配置。Redisson 默认的配置足够使用，一般不需要进行调优
  data:
    redis:
      host: ${REDIS_HOST:redis} # 地址，支持环境变量
      port: ${REDIS_PORT:6379} # 端口，支持环境变量
      database: ${REDIS_DATABASE:0} # 数据库索引
      password: ${REDIS_PASSWORD:123456} # 密码，生产环境必须开启

--- #################### Flyway 数据库迁移配置 ####################

spring:
  flyway:
    enabled: false # 单体模式下禁用 Flyway，避免多模块版本号冲突

--- #################### 定时任务相关配置 ####################

xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:false} # 是否开启调度中心，默认为 false
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:9090/xxl-job-admin} # 调度中心部署跟地址

--- #################### 消息队列相关 ####################

# rocketmq 配置项，对应 RocketMQProperties 配置类
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876} # RocketMQ Namesrv

spring:
  # RabbitMQ 配置项，对应 RabbitProperties 配置类
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1} # RabbitMQ 服务的地址
    port: ${RABBITMQ_PORT:5672} # RabbitMQ 服务的端口
    username: ${RABBITMQ_USERNAME:rabbit} # RabbitMQ 服务的账号
    password: ${RABBITMQ_PASSWORD:rabbit} # RabbitMQ 服务的密码
  # Kafka 配置项，对应 KafkaProperties 配置类
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092} # 指定 Kafka Broker 地址，可以设置多个，以逗号分隔

--- #################### 服务保障相关配置 ####################

# Lock4j 配置项
lock4j:
  acquire-timeout: 3000 # 获取分布式锁超时时间，默认为 3000 毫秒
  expire: 30000 # 分布式锁的超时时间，默认为 30 毫秒

--- #################### 监控相关配置 ####################

# Actuator 监控端点的配置项
management:
  endpoints:
    web:
      base-path: /actuator # Actuator 提供的 API 接口的根目录。默认为 /actuator
      exposure:
        include: 'health,info,metrics' # 生产环境只开放必要的端点
  endpoint:
    health:
      show-details: when-authorized # 只有授权用户才能看到详细信息

# Spring Boot Admin 配置项
spring:
  boot:
    admin:
      # Spring Boot Admin Client 客户端的相关配置
      client:
        enabled: ${SPRING_BOOT_ADMIN_ENABLED:false} # 生产环境根据需要开启
        url: ${SPRING_BOOT_ADMIN_URL:http://127.0.0.1:${server.port}/admin} # 设置 Spring Boot Admin Server 地址
        instance:
          service-host-type: IP # 注册实例时，优先使用 IP [IP, HOST_NAME, CANONICAL_HOST_NAME]
      # Spring Boot Admin Server 服务端的相关配置
      context-path: /admin # 配置 Spring Boot Admin 的访问路径

# 日志文件配置
logging:
  file:
    name: ${LOGGING_FILE_PATH:/app/logs}/${spring.application.name}.log # 日志文件路径，容器内路径
  level:
    root: INFO # 生产环境根日志级别设置为 INFO
    # 配置自己写的 MyBatis Mapper 打印日志（生产环境设置为 INFO）
    cn.iocoder.yudao.module.bpm.dal.mysql: INFO
    cn.iocoder.yudao.module.infra.dal.mysql: INFO
    cn.iocoder.yudao.module.infra.dal.mysql.logger.ApiErrorLogMapper: WARN
    cn.iocoder.yudao.module.infra.dal.mysql.job.JobLogMapper: WARN
    cn.iocoder.yudao.module.infra.dal.mysql.file.FileConfigMapper: WARN
    cn.iocoder.yudao.module.pay.dal.mysql: INFO
    cn.iocoder.yudao.module.pay.dal.mysql.notify.PayNotifyTaskMapper: WARN
    cn.iocoder.yudao.module.system.dal.mysql: INFO
    cn.iocoder.yudao.module.system.dal.mysql.sms.SmsChannelMapper: WARN
    cn.iocoder.yudao.module.tool.dal.mysql: INFO
    cn.iocoder.yudao.module.member.dal.mysql: INFO
    cn.iocoder.yudao.module.trade.dal.mysql: INFO
    cn.iocoder.yudao.module.promotion.dal.mysql: INFO
    cn.iocoder.yudao.module.statistics.dal.mysql: INFO
    cn.iocoder.yudao.module.crm.dal.mysql: INFO
    cn.iocoder.yudao.module.erp.dal.mysql: INFO
    cn.iocoder.yudao.module.iot.dal.mysql: INFO
    cn.iocoder.yudao.module.iot.dal.tdengine: INFO
    cn.iocoder.yudao.module.ai.dal.mysql: INFO
    cn.iocoder.yudao.module.hr.dal.mysql: INFO
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR

debug: false

--- #################### 微信公众号、小程序相关配置 ####################
wx:
  mp: # 公众号配置（必填），生产环境请使用环境变量配置
    app-id: ${WX_MP_APP_ID:wx5b23ba7a5589ecbb}
    secret: ${WX_MP_SECRET:2a7b3b20c537e52e74afd395eb85f61f}
    # 存储配置，解决 AccessToken 的跨节点的共享
    config-storage:
      type: RedisTemplate # 采用 RedisTemplate 操作 Redis，会自动从 Spring 中获取
