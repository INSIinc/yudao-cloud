    env-version: release # 小程序版本：正式版
  wxa-subscribe-message:
    miniprogram-state: formal # 跳转小程序类型：正式版
  tencent-lbs-key: ${TENCENT_LBS_KEY:TVDBZ-TDILD-4ON4B-PFDZA-RNLKH-VVF6E} # QQ 地图的密钥

justauth:
  enabled: true
  type:
    DINGTALK: # 钉钉
      client-id: ${JUSTAUTH_DINGTALK_CLIENT_ID:dingvrnreaje3yqvzhxg}
      client-secret: ${JUSTAUTH_DINGTALK_CLIENT_SECRET:i8E6iZyDvZj51JIb0tYsYfVQYOks9Cq1lgryEjFRqC79P3iJcrxEwT6Qk2QvLrLI}
      ignore-check-redirect-uri: true
    WECHAT_ENTERPRISE: # 企业微信
      client-id: ${JUSTAUTH_WECHAT_ENTERPRISE_CLIENT_ID:wwd411c69a39ad2e54}
      client-secret: ${JUSTAUTH_WECHAT_ENTERPRISE_CLIENT_SECRET:1wTb7hYxnpT2TUbIeHGXGo7T0odav1ic10mLdyyATOw}
      agent-id: ${JUSTAUTH_WECHAT_ENTERPRISE_AGENT_ID:1000004}
      ignore-check-redirect-uri: true
